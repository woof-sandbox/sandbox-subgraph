specVersion: 1.2.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: SandboxController
    network: sepolia
    source:
      abi: SandboxController
      address: "0x05d5a39a37c0a2c66f49747b6b9cc4fef2a4609e"
      startBlock: 9160325
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - WhitelistedCollateral
        - WhitelistedBase
      abis:
        - name: SandboxController
          file: ./abis/SandboxController.json
      eventHandlers:
        - event: BaseAssetCurveAdded(indexed
            address,(uint64,uint64,uint64,uint64,uint64,uint64,uint64,uint64),uint256)
          handler: handleBaseAssetCurveAdded
          receipt: true
        - event: BaseAssetCurveChanged(indexed
            address,(uint64,uint64,uint64,uint64,uint64,uint64,uint64,uint64),(uint64,uint64,uint64,uint64,uint64,uint64,uint64,uint64),uint256)
          handler: handleBaseAssetCurveChanged
          receipt: true
        - event: CollateralAssetWhitelisted(indexed address,indexed address,uint256)
          handler: handleCollateralAssetWhitelisted
          receipt: true
        - event: BaseAssetWhitelisted(indexed address,indexed address,uint8)
          handler: handleBaseAssetWhitelisted
          receipt: true
      file: ./src/sandbox-controller.ts
  - kind: ethereum
    name: MarketFactory
    network: sepolia
    source:
      abi: MarketFactory
      address: "0x15684b2e8e89532b7f98230ab02da5d697c9ef20"
      startBlock: 9160345
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Comet
        - Borrower
      abis:
        - name: MarketFactory
          file: ./abis/MarketFactory.json
        - name: Comet
          file: ./abis/Comet.json
        - name: Erc20
          file: ./abis/Erc20.json
        - name: ChainlinkPriceFeed
          file: ./abis/ChainlinkPriceFeed.json
      eventHandlers:
        - event: CometCreated(indexed address,indexed address,indexed address)
          handler: handleCometCreated
          receipt: true
      file: ./src/market-factory.ts
  - kind: ethereum
    name: ConfigControllerFactory
    network: sepolia
    source:
      abi: ConfigControllerFactory
      address: "0xf2270d1a6e1c4f6ce1f05c89ce326195d6196338"
      startBlock: 9160340
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Comet
      abis:
        - name: ConfigControllerFactory
          file: ./abis/ConfigControllerFactory.json
      eventHandlers:
        - event: ConfigControllerCreated(indexed address,indexed address,indexed
            address,address,address,uint32,string,uint40,uint40,uint256)
          handler: handleConfigControllerCreated
          receipt: true
      file: ./src/config-controller-factory.ts
templates:
  - name: Comet
    kind: ethereum/contract
    network: sepolia
    source:
      abi: Comet
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Comet
        - Borrower
        - PriceFeed
      abis:
        - name: Comet
          file: ./abis/Comet.json
        - name: Erc20
          file: ./abis/Erc20.json
        - name: ChainlinkPriceFeed
          file: ./abis/ChainlinkPriceFeed.json
      eventHandlers:
        - event: Withdraw(indexed address,indexed address,uint256)
          handler: handleWithdraw
          receipt: true
        - event: AbsorbDebt(indexed address,indexed address,uint256,uint256)
          handler: handleAbsorbDebt
          receipt: true
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
          receipt: true
        - event: Supply(indexed address,indexed address,uint256)
          handler: handleSupply
          receipt: true
        - event: SupplyCollateral(indexed address,indexed address,indexed address,uint256)
          handler: handleSupplyCollateral
          receipt: true
        - event: WithdrawCollateral(indexed address,indexed address,indexed
            address,uint256)
          handler: handleWithdrawCollateral
          receipt: true
        - event: TransferCollateral(indexed address,indexed address,indexed
            address,uint256)
          handler: handleTransferCollateral
          receipt: true
        - event: AbsorbCollateral(indexed address,indexed address,indexed
            address,uint256,uint256)
          handler: handleAbsorbCollateral
          receipt: true
        - event: BuyCollateral(indexed address,indexed address,uint256,uint256)
          handler: handleBuyCollateral
          receipt: true
      file: ./src/comet.ts
  - name: ConfigController
    kind: ethereum/contract
    network: sepolia
    source:
      abi: ConfigController
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - ConfigController
        - Comet
        - Progress
        - CuratorProposal
      abis:
        - name: ConfigController
          file: ./abis/ConfigController.json
      eventHandlers:
        - event: CometCreated(address,address,address,uint256,uint256)
          handler: handleCometCreated
          receipt: true
        - event: CuratorProposed(indexed address,indexed address,uint64)
          handler: handleCuratorProposed
          receipt: true
        - event: CuratorAccepted(indexed address,indexed address)
          handler: handleCuratorAccepted
          receipt: true
        - event: CuratorCanceled(indexed address)
          handler: handleCuratorCanceled
          receipt: true
        - event: CuratorProposalCancelled(indexed address)
          handler: handleCuratorProposalCancelled
          receipt: true
        - event: GuardianUpdated(indexed address,indexed address)
          handler: handleGuardianUpdated
          receipt: true
      file: ./src/config-controller.ts
