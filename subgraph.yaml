specVersion: 1.2.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Configurator
    network: sepolia
    source:
      address: "0x129C4c47Db4822A2e8fc1b843BfE2DA796746469"
      abi: Configurator
      startBlock: 7735223
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Comet
        - Borrower
      abis:
        - name: Configurator
          file: ./abis/Configurator.json
        - name: Comet
          file: ./abis/Comet.json
      eventHandlers:
        - event: CometDeployed(indexed address,indexed address)
          handler: handleCometDeployed
      file: ./src/configurator.ts
templates:
  - name: Comet
    kind: ethereum/contract
    network: sepolia
    source:
      abi: Comet
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Comet
        - Borrower
      abis:
        - name: Comet
          file: ./abis/Comet.json
      eventHandlers:
        - event: Withdraw(indexed address,indexed address,uint256)
          handler: handleWithdraw
      file: ./src/comet.ts
