specVersion: 1.2.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Configurator
    network: mainnet
    source:
      address: "0x316f9708bB98af7dA9c68C1C3b5e79039cD336E3"
      abi: Configurator
      startBlock: 15331590
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Comet
        - Borrower
      abis:
        - name: Configurator
          file: ./abis/Configurator.json
        - name: Comet
          file: ./abis/Comet.json
      eventHandlers:
        - event: CometDeployed(indexed address,indexed address)
          handler: handleCometDeployed
      file: ./src/configurator.ts
templates:
  - name: Comet
    kind: ethereum/contract
    network: mainnet
    source:
      abi: Comet
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Comet
        - Borrower
      abis:
        - name: Comet
          file: ./abis/Comet.json
      eventHandlers:
        - event: Withdraw(indexed address,indexed address,uint256)
          handler: handleWithdraw
        - event: AbsorbDebt(indexed address,indexed address,uint256,uint256)
          handler: handleAbsorbDebt
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
        - event: Supply(indexed address,indexed address,uint256)
          handler: handleSupply
      file: ./src/comet.ts
